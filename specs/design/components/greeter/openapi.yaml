openapi: 3.0.3
info:
  title: Greeter API
  version: 0.1.0
  description: Returns a JSON greeting, personalized by an optional name.
servers:
  - url: /
paths:
  /hello:
    get:
      operationId: getGreeting
      summary: Return a JSON greeting for the given name, or a default greeting when name is omitted
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: The name to personalize the greeting with
      responses:
        '200':
          description: A JSON greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
components:
  schemas:
    Greeting:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: The rendered greeting text, e.g. "Hello, World!" or "Hello, Alice!"
